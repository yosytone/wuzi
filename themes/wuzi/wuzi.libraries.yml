# These will be loaded on every pages.
global:
  version: 1.0.14
  css:
    component:
      css/base/elements.css: {}
      css/bootstrap-icons.css: {}
      css/slick.css: {}
      css/slick-theme.css: {}
    theme:
      css/style.css: { minified: false }
  js:
    js/slick.js: {}
    js/kart.js: {}
    js/wuzi.js: {}
  dependencies:
    - core/jquery
    - core/drupal

# Book
book:
  version: 1.0.14
  css:
    component:
      css/book.css: {}

# maintenance page
maintenance:
  version: 1.0.14
  css:
    theme:
      css/maintenance.css: {}

# Theme settings
theme-settings:
  version: 1.0.14
  css:
    theme:
      css/theme-settings.css: {}

fancybox:
  version: 3.x
  js:
    https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js: { type: external }
    js/fancybox-init.js: {}
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css: { type: external }
  dependencies:
    - core/jquery
